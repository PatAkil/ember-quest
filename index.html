<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Installed to a Home Screen, the game opens without browser chrome —
         the one route to fullscreen on iPhone, which has no requestFullscreen.
         The translucent status bar lets the frame run under the notch. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ember Quest</title>
    <style>
      /* One markup, three states:
         1. Desktop cabinet (≥1100×700 CSS px): marquee + bezel + hint around a
            letterboxed 16:9 screen.
         2. Phone landscape: the chrome is gone, black ground, the screen fills
            the viewport (letterboxed to 16:9, centred).
         3. Phone portrait (≤900 px wide): the #rotate overlay covers everything
            and asks for landscape. */
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #000;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        overflow: hidden;
        /* The page IS a game surface: no pan/zoom gestures, no rubber-banding,
           no text selection, no long-press callout. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
      }
      /* State 2 is the base: nothing but the screen. dvh (where supported)
         tracks the phone's collapsing browser bar; vh is the fallback. */
      #cabinet {
        height: 100vh; height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0; padding: 0; box-sizing: border-box;
      }
      #marquee, #hint { display: none; }
      #bezel { padding: 0; }
      /* The game module creates <canvas> and appends it here. */
      #screen { display: block; background: #000; line-height: 0; }
      /* An HD 16:9 frame. It scales SMOOTH — the pixelated plane lives inside
         the frame — and the width formula keeps it inside both 100vw and 100vh
         at its own ratio, so the max-* clamps never squash it. object-fit keeps
         a bitmap of any other ratio (the v2 game) letterboxed, not stretched. */
      #screen canvas {
        display: block; image-rendering: auto; object-fit: contain;
        touch-action: none; outline: none;
        width: min(100vw, calc(100vh * 16 / 9)); width: min(100dvw, calc(100dvh * 16 / 9));
        height: auto; aspect-ratio: 16 / 9;
        max-width: 100vw; max-height: 100vh;
      }

      /* State 1: the arcade cabinet, only where it has room. */
      @media (min-width: 1100px) and (min-height: 700px) {
        html, body { background: #0b0b0f; }
        #cabinet { gap: 14px; padding: 20px; }
        #marquee {
          display: block;
          color: #ffec27; letter-spacing: 0.35em; font-size: 13px;
          text-transform: uppercase; text-shadow: 0 0 8px rgba(255,236,39,0.5);
        }
        #bezel {
          padding: 18px; border-radius: 18px;
          background: linear-gradient(160deg, #23232c, #131318);
          box-shadow: inset 0 0 0 2px #34343f, 0 20px 60px rgba(0,0,0,0.6);
        }
        #screen { border-radius: 8px; overflow: hidden; }
        /* Leave room for the chrome: 2 × (20 cabinet + 18 bezel) across,
           marquee + hint + gaps + padding (~150 px) down. */
        #screen canvas { width: min(100vw - 76px, calc((100vh - 150px) * 16 / 9)); }
        #hint { display: block; color: #5f574f; font-size: 11px; letter-spacing: 0.1em; }
      }

      /* State 3: a phone held upright — the game is landscape only. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #0b0b0f; color: #ffec27;
        flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; text-align: center;
      }
      /* A phone outline that turns on its side and back: the whole message. */
      #rotate .phone {
        width: 30px; height: 54px; box-sizing: border-box;
        border: 3px solid #ffec27; border-radius: 6px;
        box-shadow: inset 0 -6px 0 -3px #ffec27;
        animation: rotate-phone 2.4s ease-in-out infinite;
      }
      @keyframes rotate-phone {
        0%, 20% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .phone { animation: none; transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }

      /* iPhone Safari has no requestFullscreen — installing to the Home Screen
         is the one route to a chrome-free, fullscreen game (see the pointerdown
         handler below). Hidden by default; a script below shows it only on
         iOS Safari that isn't already running standalone. Sits above the
         canvas but never blocks it. */
      #addHome {
        display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
        padding: 6px 10px; box-sizing: border-box; text-align: center;
        background: rgba(11,11,15,0.82); color: #ffec27;
        font-size: 11px; letter-spacing: 0.06em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="cabinet">
      <div id="marquee">▚ Ember Quest</div>
      <div id="bezel"><div id="screen"></div></div>
      <div id="hint">click the screen &amp; press a key to start</div>
    </div>
    <div id="rotate"><div class="phone"></div><div>rotate to landscape</div></div>
    <div id="addHome">tap Share, then "Add to Home Screen" for fullscreen</div>
    <script>
      // Fullscreen on the first tap, small screens only. Capture phase so the
      // gesture is still fresh; once, so a desktop click never asks. iOS Safari
      // has no requestFullscreen — that is expected and swallowed, never fatal.
      // Once fullscreen is granted (the only state the lock is allowed in on
      // Android), lock to landscape; where fullscreen does not exist at all the
      // lock is tried anyway — it mostly rejects, but an installed web app may
      // honour it. Every rejection is swallowed: the #rotate overlay is the
      // fallback, and the game runs in the page as it is.
      (function () {
        function lockLandscape() {
          try {
            var o = window.screen && window.screen.orientation;
            if (!o || typeof o.lock !== 'function') return;
            var p = o.lock('landscape');
            if (p && typeof p.catch === 'function') p.catch(function () {});
          } catch (e) {
            /* no orientation lock here — the rotate prompt covers it */
          }
        }
        document.addEventListener(
          'pointerdown',
          function () {
            try {
              if (!window.matchMedia('(max-width: 900px)').matches) return;
              var el = document.documentElement;
              if (typeof el.requestFullscreen !== 'function') {
                lockLandscape();
                return;
              }
              var pending = el.requestFullscreen({ navigationUI: 'hide' });
              if (pending && typeof pending.then === 'function') {
                pending.then(lockLandscape).catch(function () {});
              }
            } catch (e) {
              /* no fullscreen here — the game runs in the page as it is */
            }
          },
          { once: true, capture: true }
        );
      })();
    </script>
    <script>
      // The Home-Screen hint: iOS Safari alone has neither requestFullscreen
      // nor an install prompt, so the only route to a chrome-free frame is the
      // user adding the page to their Home Screen by hand. Shown only there,
      // and only when not already running from that installed icon.
      (function () {
        try {
          var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          var standalone = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (isIOS && !standalone) {
            var el = document.getElementById('addHome');
            if (el) el.style.display = 'block';
          }
        } catch (e) {
          /* no hint without a confident detection — never a fatal error */
        }
      })();
    </script>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
