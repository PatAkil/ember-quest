<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ember Quest</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #0b0b0f;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        overflow: hidden;
      }
      #cabinet {
        height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 6px;
        padding: 8px; box-sizing: border-box;
      }
      #marquee {
        color: #ffec27; letter-spacing: 0.35em; font-size: 13px; line-height: 16px;
        text-transform: uppercase; text-shadow: 0 0 8px rgba(255,236,39,0.5);
        user-select: none;
      }
      #bezel {
        padding: 10px; border-radius: 14px;
        background: linear-gradient(160deg, #23232c, #131318);
        box-shadow: inset 0 0 0 2px #34343f, 0 16px 48px rgba(0,0,0,0.6);
      }
      #screen {
        display: block; border-radius: 6px; overflow: hidden;
        background: #000; line-height: 0;
      }
      #screen canvas {
        display: block; image-rendering: pixelated;
      }
      #hint {
        color: #a39c94; font-size: 11px; line-height: 14px; letter-spacing: 0.1em; user-select: none;
      }
      @media (max-width: 300px), (max-height: 260px) {
        #cabinet { padding: 0; gap: 0; }
        #marquee, #hint { display: none; }
        #bezel { padding: 0; border-radius: 0; box-shadow: none; }
        #screen { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <div id="cabinet">
      <div id="marquee">▚ Ember Quest</div>
      <div id="bezel"><div id="screen"></div></div>
      <div id="hint">click the screen &amp; press a key to start</div>
    </div>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
